# alembic.ini
# Alembic database migration configuration for the Authentix backend.
# Place this file at the project root (d:/Projects/Hackathon/Authentix/).
#
# Run migrations from the project root:
#   .\.venv\Scripts\alembic upgrade head

[alembic]
# Path to the migrations directory (relative to this file)
script_location = backend/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
timezone = UTC

# Truncate long slugs in filenames
truncate_slug_length = 40

# sys.path is used to discover the app modules
prepend_sys_path = .

# Database connection URL — overridden by env.py which reads from Settings
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/authentix


[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
